name: Publish locally packed npm tarballs
run-name: Publish npm ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Signed release tag, for example 1.2.3
        required: true
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub hides draft releases from read-only tokens. This job never edits
    # repository contents, but needs write permission to download draft assets.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Check out publisher from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .npm-publisher
          sparse-checkout: scripts/publish-npm-provenance.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm with OIDC trusted publishing support
        run: npm install -g npm@11
      - name: Download locally packed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true
          mkdir -p "$RUNNER_TEMP/npm-release"
          gh release download "$VERSION" --dir "$RUNNER_TEMP/npm-release" \
            --pattern '*.tgz' --pattern '*.tgz.sha256'
      - name: Verify all tarballs before publishing any
        env:
          VERSION: ${{ inputs.version }}
        run: .npm-publisher/scripts/publish-npm-provenance.sh verify "$VERSION" "$RUNNER_TEMP/npm-release"
      - name: Publish exact tarballs to npm with provenance
        env:
          VERSION: ${{ inputs.version }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          .npm-publisher/scripts/publish-npm-provenance.sh publish "$VERSION" "$RUNNER_TEMP/npm-release"
