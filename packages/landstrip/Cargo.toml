
[package]
authors = ["Jarkko Sakkinen <jarkko.sakkinen@iki.fi>"]
description = "Sandbox for coding agents with parametrized state"
edition = "2024"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/landstrip/landstrip"
repository = "https://github.com/landstrip/landstrip"
name = "landstrip"
readme = "README.md"
rust-version = "1.95"
version = "0.22.2"
autotests = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.10"
getrandom = "0.4"
globset = "0.4.21"
hex = "0.4"
libc = "0.2"
log = "0.4.30"
path-clean = "1.0"
proptest = { version = "1.12", default-features = false, features = ["handle-panics", "std"] }
proptest-state-machine = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.13"
strum = { version = "0.28", features = ["derive"] }
walkdir = "2.5"
which = "8.0"

[target.'cfg(unix)'.dependencies]
nix = "0.31"
xattr = "1.6"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
syscalls = { version = "0.8", default-features = false }
nix = { version = "0.31", features = ["fs", "inotify", "ioctl", "mount", "poll", "process", "sched", "signal", "socket", "uio", "user"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
bitflags = "2.13"
clear-cache = "0.1"
goblin = { version = "0.10", default-features = false, features = ["elf64", "elf32", "endian_fd", "std"] }
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "ioctl", "mempolicy", "prctl"] }
vm-memory = { version = "0.18", features = ["backend-mmap"] }

[target.'cfg(target_os = "windows")'.dependencies]
chacha20 = { version = "0.10", features = ["rng", "zeroize"] }
rand = "0.10"
zeroize = "1.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Rpc",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
